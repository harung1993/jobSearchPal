<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dashboard{% endblock %} · JobSearchPal</title>
<script>try{const t=localStorage.getItem("aa-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;
 --bg:#f4f4f1;--surface:#fcfcfb;--surface-2:#f0efeb;--surface-3:#e8e7e1;--line:rgba(11,11,11,.08);--line-2:#e1e0d9;
 --ink:#0b0b0b;--ink-2:#52514e;--ink-3:#898781;
 --accent:#2a78d6;--accent-ink:#1c5cab;--accent-soft:#e4eefb;--series-1:#2a78d6;--track:#ebeae4;--axis:#c3c2b7;
 --good:#006300;--good-dot:#0ca30c;--good-soft:#e2f3e2;--warn:#8a5a00;--warn-dot:#fab219;--warn-soft:#fdf1d6;
 --bad:#b42318;--bad-dot:#d03b3b;--bad-soft:#fde7e4;
 --shadow:0 1px 2px rgba(20,20,10,.04),0 8px 24px -12px rgba(20,20,10,.10);--radius:16px;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
 --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#222220;--surface-3:#2c2c2a;--line:rgba(255,255,255,.08);--line-2:#2c2c2a;
 --ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#898781;
 --accent:#3987e5;--accent-ink:#86b6ef;--accent-soft:#16263b;--series-1:#3987e5;--track:#262624;--axis:#383835;
 --good:#4cc94c;--good-dot:#0ca30c;--good-soft:#132a13;--warn:#f2c14e;--warn-dot:#fab219;--warn-soft:#2e2510;
 --bad:#f07167;--bad-dot:#d03b3b;--bad-soft:#3a1916;--shadow:none;}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#222220;--surface-3:#2c2c2a;--line:rgba(255,255,255,.08);--line-2:#2c2c2a;
 --ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#898781;
 --accent:#3987e5;--accent-ink:#86b6ef;--accent-soft:#16263b;--series-1:#3987e5;--track:#262624;--axis:#383835;
 --good:#4cc94c;--good-dot:#0ca30c;--good-soft:#132a13;--warn:#f2c14e;--warn-dot:#fab219;--warn-soft:#2e2510;
 --bad:#f07167;--bad-dot:#d03b3b;--bad-soft:#3a1916;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14.5px/1.55 "Inter var",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)} .sr{position:absolute;left:-9999px}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--surface) 231px,var(--line) 231px,var(--line) 232px,transparent 232px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 14px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;padding:4px 10px 18px;color:var(--ink)}
.brand svg{flex:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);font-weight:550}
.nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--ink-2);padding:5px 0;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.main{padding:28px 32px 72px;max-width:1240px;width:100%}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr);background:none}
 .side{position:sticky;z-index:5;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
 .brand{padding:0 8px 0 0}.brand span{display:none}.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}.nav a{padding:7px 10px;white-space:nowrap}
 .side{min-width:0}.nav a{padding:7px 8px;font-size:13.5px}.nav svg{display:none}
 .side .foot{margin:0 0 0 auto;flex-direction:row}.side .foot .seg,.sync-lbl{display:none}
 .main{padding:20px 16px 56px}}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700}
.ph .sub{color:var(--ink-2);margin-top:4px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
header.top h1{font-size:24px;margin:0;letter-spacing:-.02em}

/* cards & grids */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)} .g11{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g11{grid-template-columns:1fr}}
@media (max-width:520px){.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13.5px;font-weight:650;margin:0 0 14px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .count{font-weight:600;color:var(--ink-3)}
.card h2 a{font-size:13px;font-weight:600}
.mt{margin-top:16px}

/* stat tiles */
.tile .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile .num{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.tile .num small{font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.tile .sub{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:12px}
.meter>span{display:block;height:100%;border-radius:3px;background:var(--accent)} .meter.ok>span{background:var(--good-dot)}

/* pills & status */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;text-transform:capitalize}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.pill.interview,.pill.offer,.pill.submitted{background:var(--good-soft);color:var(--good)} .pill.interview::before,.pill.offer::before,.pill.submitted::before{background:var(--good-dot)}
.pill.rejected,.pill.failed{background:var(--bad-soft);color:var(--bad)} .pill.rejected::before,.pill.failed::before{background:var(--bad-dot)}
.pill.filled,.pill.confirmed,.pill.recruiter{background:var(--accent-soft);color:var(--accent-ink)} .pill.filled::before,.pill.confirmed::before,.pill.recruiter::before{background:var(--accent)}
.pill.ignored,.pill.unsure{background:var(--surface-2);color:var(--ink-3)}
.pill.guess{background:transparent;border:1px dashed var(--line-2)}
.badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px}
.pill.waiting{background:var(--warn-soft);color:var(--warn)} .pill.waiting::before{background:var(--warn-dot)}

/* run strip */
.runs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px}
.run{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px}
.run b{font-weight:600;color:var(--ink)} .run i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block;flex:none}
.run.ok i{background:var(--good-dot)}.run.stale i{background:var(--warn-dot)}.run.fail i{background:var(--bad-dot)} .run.never{color:var(--ink-3)}

/* tables */
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2)}
td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;overflow-wrap:break-word} tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--surface-2)}
@media (max-width:640px){.hide-sm{display:none}td,th{padding:9px 6px}}

/* lists */
.ready{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)} .ready:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.ready .body{flex:1;min-width:0}.ready .t{font-weight:650}.ready .m{font-size:12.5px;color:var(--ink-2)}
.feed{padding:0;margin:0}.feed li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.feed li:last-child{border-bottom:0}.feed .when{color:var(--ink-3);font-size:12px;white-space:nowrap;margin-left:auto}
.feed .who{font-weight:600}
.empty{color:var(--ink-3);padding:6px 0}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{text-decoration:none;background:var(--surface-2)} .btn.sm{padding:5px 10px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.06)}
.btn.go{background:var(--good-dot);border-color:var(--good-dot);color:#fff}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink)}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
.doc{width:100%;height:560px;border:1px solid var(--line-2);border-radius:12px;background:#fff}
.shot{max-width:100%;border:1px solid var(--line-2);border-radius:12px}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible} .chart text{fill:var(--ink-3);font-size:11px;font-family:inherit}
.chart .bar{fill:var(--series-1)} .chart .bar.now{opacity:.5} .chart .grid{stroke:var(--line-2)} .chart .base{stroke:var(--axis)}
.chart .floor{stroke:var(--ink-2);stroke-dasharray:4 4;stroke-width:1.5} .chart .flabel{fill:var(--ink-2)}
.chart .hit{fill:transparent} .chart g:hover .bar{filter:brightness(1.12)}
.hbars .row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 44px;gap:12px;align-items:center;margin:9px 0;font-size:13.5px}
.hbars .track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}.hbars .fill{height:100%;background:var(--series-1);border-radius:5px;min-width:3px}
.hbars .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.hbars .conv{font-size:11.5px;color:var(--ink-3);font-weight:500}
@media (max-width:640px){.hbars .row{grid-template-columns:minmax(0,110px) minmax(0,1fr) 36px}}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:550;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:260px}
</style></head><body>
{% set nav = nav|default('') %}
<div class="app">
<aside class="side">
 <a class="brand" href="/" aria-label="JobSearchPal home"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="8" fill="var(--accent)"/><path d="M7 17.5 11.5 8h3L19 17.5h-3l-.9-2.2h-4.3l-.9 2.2H7Zm4.7-4.6h2.6L13 9.8l-1.3 3.1Z" fill="#fff"/></svg><span>JobSearchPal</span></a>
 <nav class="nav" aria-label="Main">
  <a href="/" {% if nav == 'dashboard' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg><span class="lbl">Dashboard</span></a>
  <a href="/stats" {% if nav == 'stats' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="lbl">Stats</span></a>
  <a href="/emails" {% if nav == 'emails' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="lbl">Emails</span>{% if pending_count is defined and pending_count %}<span class="badge" aria-label="{{ pending_count }} waiting">{{ pending_count }}</span>{% endif %}</a>
  <a href="/dua" {% if nav == 'work' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h5"/></svg><span class="lbl">{{ ws_label|default('Work search') }}</span></a>
  <a href="/settings" {% if nav == 'settings' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="lbl">Settings</span></a>
 </nav>
 <div class="foot">
  <form method="post" action="/sync" style="margin:0"><button class="btn sm" style="width:100%;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span class="sync-lbl">Sync email</span></button></form>
  <div class="seg" role="group" aria-label="Theme"><button data-t="">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
 </div>
</aside>
<main class="main">{% block body %}{% endblock %}</main>
</div>
<div id="tip" role="tooltip"></div>
<script>
// One tooltip for every chart mark with data-tip.
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]");
 if(!t){tip.style.opacity=0;return}tip.textContent=t.dataset.tip;tip.style.opacity=1;
 tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY-38)+"px"});
// Theme toggle: Auto follows the OS; the choice is remembered on this device only.
const seg=document.querySelectorAll(".seg button"),cur=document.documentElement.dataset.theme||"";
seg.forEach(b=>{b.setAttribute("aria-pressed",b.dataset.t===cur);b.onclick=()=>{
 if(b.dataset.t)document.documentElement.dataset.theme=b.dataset.t;else delete document.documentElement.dataset.theme;
 try{b.dataset.t?localStorage.setItem("aa-theme",b.dataset.t):localStorage.removeItem("aa-theme")}catch(e){}
 seg.forEach(x=>x.setAttribute("aria-pressed",x===b))}});
</script></body></html>
