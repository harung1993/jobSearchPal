# Unemployment work-search rules for every US state, DC, Puerto Rico and the US Virgin Islands.
# Used by the Setup page and the work-search log. NOT legal advice: rules change, and your state's
# notice to you is what counts. Each entry links the agency page it was checked against.
#
# Fields
#   weekly_minimum  activities per week (null = no fixed number, see rule); varies: true when it depends
#                   on where you live or is assigned per claimant (minimum_note explains)
#   rule / report   plain-English requirement and how it's reported
#   must_register   state job-bank registration, when required
#   keep_records    how long to keep your log, when the state says
#   exemptions      common waivers (approved training, recall date, union hall...)
#   weekly_benefit  minimum to maximum weekly benefit; max_weeks: weeks payable (ranges depend on wages
#                   and the state's unemployment rate). From US DOL "Significant Provisions of State UI
#                   Laws", January 2026.
#   waiting_week    the unpaid first week, if the state has one (DOL Comparison of State UI Laws 2023, Table 3-7)
#   part_time_earnings_allowed  part-time pay you can earn in a week before benefits are reduced (DOL, Jan 2026)
#   source          official = the agency's own site; confidence: high / medium (agency gives no exact
#                   number) / low (couldn't confirm on the agency site; check before relying on it)
#   checked         when the entry was last compared with its source
# Backbone: US DOL Comparison of State UI Laws 2023, Tables 5-14 and 5-15 (work search requirements and
# reporting). Every state was then re-checked on its agency's site on 2026-11-04; several had changed
# since 2023 (AR, ID, IA, KY, LA, MI, TN, WV).
# Applies everywhere (show these on the Setup page):
#   - Benefits are taxable federal income; most states let you have 10% withheld. Some states tax them too.
#   - Keep filing your weekly or biweekly claim even during the waiting week, or it may not count.
#   - Severance, vacation or holiday pay can delay or reduce benefits in many states; report it.
#   - If you're picked for RESEA (reemployment) appointments, they're mandatory; missing one stops benefits.
#   - Report all part-time earnings for the week you earned them, not when you're paid.
#   - Never guess: the notice your state sends you about your own claim overrides anything here.
# Found a rule that's out of date? Fix the entry, set checked: to today, and open a pull request.
checked: '2026-11-04'
source: official
general:
- Unemployment benefits are taxable federal income; most states let you choose 10% federal withholding. Some states
  also tax them.
- Keep filing your weekly or biweekly claim during the waiting week, or it may not count.
- Severance, vacation or holiday pay can delay or reduce benefits in many states. Report it.
- If you're selected for RESEA (reemployment) appointments, they're mandatory. Missing one can stop your benefits.
- Report part-time earnings for the week you did the work, not the week you're paid.
- The notice your state sends about your own claim overrides anything here.
