# Unemployment work-search rules by state, for the Setup page and the work-search log.
# checked: when the entry was last compared with a source. source: "summary" = a third-party roundup
# (tealhq.com/post/work-search-requirements-for-unemployment-benefits-by-state), "official" = the agency's own page.
# Rules change. If yours is wrong, fix the entry, set source: official and today's date, and open a pull request.
# waiting_week: true when the first week of a claim is unpaid (null = not checked yet).
# weekly_minimum: null when the state sets no number or sets it per claimant (varies: true).
checked: 2026-11-04
source: summary
states:
  AL:
    name: Alabama
    weekly_minimum: null
    varies: false
    rule: Reasonable active search required; no number stated
    report: Entered with each weekly certification
    url: https://labor.alabama.gov/
  AK:
    name: Alaska
    weekly_minimum: null
