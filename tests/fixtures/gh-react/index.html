<!doctype html><html><head><meta charset="utf-8"></head><body>
<!-- Shaped like job-boards.greenhouse.io: react-select dropdowns with a hidden required mirror input,
     file inputs whose only label is the "Attach" button, and a city autocomplete. -->
<form id="f" onsubmit="event.preventDefault()">
<div class="field"><label id="first_name-label" for="first_name">First Name*</label><input id="first_name" aria-required="true"></div>
<div class="file-upload" aria-labelledby="upload-label-resume"><div id="upload-label-resume" class="label">Resume/CV*</div>
 <div class="file-upload__wrapper"><label class="button" for="resume">Attach</label><input type="file" id="resume" class="visually-hidden" style="position:absolute;width:1px;height:1px;opacity:0"></div></div>
<div class="file-upload" aria-labelledby="upload-label-cover_letter"><div id="upload-label-cover_letter" class="label">Cover Letter</div>
 <div class="file-upload__wrapper"><label class="button" for="cover_letter">Attach</label><input type="file" id="cover_letter" class="visually-hidden" style="position:absolute;width:1px;height:1px;opacity:0"></div></div>
<div class="select" data-opts="Yes|No"><label id="q1-label" for="q1">Will you require sponsorship?*</label>
 <div class="select__container"><div class="select__control"><input id="q1" role="combobox" aria-labelledby="q1-label" aria-required="true"></div></div>
 <input tabindex="-1" aria-hidden="true" required style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="select" data-opts="0-2 years|3-5 years|6-8 years|8+ years"><label id="q2-label" for="q2">Years of data engineering experience*</label>
 <div class="select__container"><div class="select__control"><input id="q2" role="combobox" aria-labelledby="q2-label" aria-required="true"></div></div>
 <input tabindex="-1" aria-hidden="true" required style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="select" data-async="Springfield, Illinois, United States|Springfield, Missouri, United States"><label id="loc-label" for="candidate-location">Location (City)*</label>
 <div class="select__container"><div class="select__control"><input id="candidate-location" role="combobox" aria-labelledby="loc-label"></div></div>
 <input tabindex="-1" aria-hidden="true" required style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="phone"><label for="phone">Phone</label><input id="phone">
 <ul role="listbox" class="iti__country-list"><li role="option">Afghanistan +93</li><li role="option">Albania +355</li><li role="option">United States +1</li></ul></div>
<div class="select" data-opts="LinkedIn|Built In|Referral|Other"><label id="q3-label" for="q3">How did you hear about us?*</label>
 <div class="select__container"><div class="select__control"><input id="q3" role="combobox" aria-labelledby="q3-label"></div></div>
 <input tabindex="-1" aria-hidden="true" required style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="select" data-opts="Yes|No"><label id="q4-label" for="q4">Are you open to relocation?</label>
 <div class="select__container"><div class="select__control"><input id="q4" role="combobox" aria-labelledby="q4-label"></div></div>
 <input tabindex="-1" aria-hidden="true" style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="select" data-opts="Yes|No"><label id="q5-label" for="q5">Do you accept the listed salary range?</label>
 <div class="select__container"><div class="select__control"><input id="q5" role="combobox" aria-labelledby="q5-label"></div></div>
 <input tabindex="-1" aria-hidden="true" style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="select" data-opts="Yes|No"><label id="q6-label" for="q6">Are you legally authorized to work in the country in which this job is based?*</label>
 <div class="select__container"><div class="select__control"><input id="q6" role="combobox" aria-labelledby="q6-label"></div></div>
 <input tabindex="-1" aria-hidden="true" required style="opacity:0;width:100%;height:1px;position:absolute" value=""></div>
<div class="field"><label for="country">Country</label><input id="country"></div>
<button type="submit">Submit application</button></form>
<pre id="state"></pre>
<script>
// Minimal react-select: options render into a menu only while the control is open.
document.querySelectorAll(".select").forEach(box => {
  const input = box.querySelector("[role=combobox]"), mirror = box.querySelector("[aria-hidden=true]");
  const close = () => box.querySelector(".select__menu")?.remove();
  const open = () => {
    close();
    let opts = (box.dataset.opts || "").split("|").filter(Boolean);
    if (box.dataset.async) {                        // autocomplete: nothing until you type
      if (input.value.length < 3) return;
      opts = box.dataset.async.split("|").filter(o => o.toLowerCase().startsWith(input.value.toLowerCase().slice(0, 3)));
    } else if (input.value) opts = opts.filter(o => o.toLowerCase().includes(input.value.toLowerCase()));
    const menu = document.createElement("div"); menu.className = "select__menu";
    opts.forEach(o => { const d = document.createElement("div"); d.className = "select__option"; d.setAttribute("role", "option"); d.textContent = o;
      d.onmousedown = e => { e.preventDefault(); input.value = o; mirror.value = o; close(); }; menu.appendChild(d); });
    box.querySelector(".select__container").appendChild(menu);
  };
  input.addEventListener("mousedown", () => setTimeout(open, 50));
  input.addEventListener("input", () => setTimeout(open, box.dataset.async ? 700 : 50));
  input.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  input.addEventListener("blur", () => setTimeout(close, 100));
});
document.getElementById("f").addEventListener("change", () => {
  document.getElementById("state").textContent = JSON.stringify({
    resume: document.getElementById("resume").files[0]?.name, cover: document.getElementById("cover_letter").files[0]?.name,
    q1: document.querySelectorAll("[aria-hidden=true]")[0].value, q2: document.querySelectorAll("[aria-hidden=true]")[1].value,
    loc: document.querySelectorAll("[aria-hidden=true]")[2].value });
});
</script></body></html>
