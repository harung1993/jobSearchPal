<!doctype html><html><head><meta charset="utf-8"></head><body><h1>Senior Analytics Engineer</h1>
<form id="application_form" onsubmit="event.preventDefault(); document.body.innerHTML='<h2>Thank you for applying!</h2>'">
<div class="field"><label for="first_name">First Name *</label><input id="first_name" required></div>
<div class="field"><label for="last_name">Last Name *</label><input id="last_name" required></div>
<div class="field"><label for="email">Email *</label><input id="email" type="email" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone"></div>
<div class="field"><label>Resume/CV *</label><button type="button">Attach</button><input type="file" id="resume" style="display:none" required></div>
<div class="field"><label>Cover Letter</label><input type="file" id="cover_letter" style="display:none"></div>
<div class="field"><label for="li">LinkedIn Profile</label><input id="li"></div>
<div class="field"><label for="q1">Will you now or in the future require visa sponsorship? *</label>
 <select id="q1" required><option></option><option>Yes</option><option>No</option></select></div>
<fieldset><legend>Are you legally authorized to work in the United States? *</legend>
 <label><input type="radio" name="auth" value="1" required> Yes</label><label><input type="radio" name="auth" value="0"> No</label></fieldset>
<div class="field"><label for="why">Why do you want to work here?</label><textarea id="why"></textarea></div>
<div class="field"><label for="gender">Gender</label><select id="gender"><option></option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
<div class="field"><input type="checkbox" id="consent" required><label for="consent">I acknowledge the Privacy Notice and consent to processing of my personal data *</label></div>
<button type="submit">Submit Application</button></form></body></html>
