<!doctype html><html><head><meta charset="utf-8"></head><body>

<form onsubmit="event.preventDefault(); const f=document.createElement('iframe'); f.src='about:blank#hcaptcha'; f.title='Main content of the hCaptcha challenge'; f.style.width='400px'; f.style.height='500px'; document.body.appendChild(f);">
<button type="submit" class="hidden" id="hcaptchaSubmitBtn" style="display:none"></button>
